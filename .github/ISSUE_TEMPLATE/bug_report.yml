name: Bug report
description: Report a reproducible problem in Android LLM Service
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Android version, device, app build/commit, model, and anything else relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: Paste only non-sensitive logs or diagnostics.
      render: shell
